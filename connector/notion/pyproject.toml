[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actus-notion"
version = "0.1.6"
description = "Independent Notion Hosted MCP OAuth connector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["actus-connector-sdk==0.0.1b9", "pydantic>=2.12.4,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[dependency-groups]
dev = ["actus-connector-sdk[build,serve]==0.0.1b9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.connector]
entrypoint = "notion_connector.app:App"
build-files = [
  "README.md", "src/notion_connector/__init__.py", "src/notion_connector/app.py",
  "src/notion_connector/auth.py", "src/notion_connector/models.py",
  "src/notion_connector/mcp.py", "src/notion_connector/schema.py",
  "src/notion_connector/protocol.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true
