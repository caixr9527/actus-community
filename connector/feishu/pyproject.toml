[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actus-feishu"
version = "0.1.2"
description = "Independent Feishu user OAuth, documents, wiki and Base connector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["actus-connector-sdk==0.0.1b9", "pydantic>=2.12.4,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1"]

[dependency-groups]
dev = ["actus-connector-sdk[build,serve]==0.0.1b9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.connector]
entrypoint = "feishu_connector.app:App"
build-files = [
  "README.md", "src/feishu_connector/__init__.py", "src/feishu_connector/app.py",
  "src/feishu_connector/auth.py", "src/feishu_connector/api.py",
  "src/feishu_connector/diagnostics.py",
  "src/feishu_connector/models.py", "src/feishu_connector/docs.py",
  "src/feishu_connector/wiki.py", "src/feishu_connector/bitable.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true
