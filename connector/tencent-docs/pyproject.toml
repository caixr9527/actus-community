[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actus-tencent-docs"
version = "0.1.0"
description = "Tencent Docs personal API Key connector"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["actus-connector-sdk==0.0.1b3.dev1", "pydantic>=2.12.4,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.connector]
entrypoint = "tencent_docs.app:App"
build-files = [
  "README.md", "src/tencent_docs/__init__.py", "src/tencent_docs/app.py",
  "src/tencent_docs/models.py", "src/tencent_docs/mcp.py",
  "src/tencent_docs/common.py", "src/tencent_docs/doc.py", "src/tencent_docs/manage.py",
  "src/tencent_docs/sheet.py", "src/tencent_docs/slides.py", "src/tencent_docs/smartsheet.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
