[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "actus-file-demo"
version = "0.1.1"
description = "Independent generic single-file transfer example"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["actus-connector-sdk==0.0.1b8.dev5", "pydantic>=2.12.4,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2", "uvicorn>=0.41,<0.42"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.connector]
entrypoint = "file_demo.app:App"
build-files = ["README.md", "src/file_demo/__init__.py", "src/file_demo/app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "tencent"
url = "https://mirrors.cloud.tencent.com/pypi/simple"
default = true
